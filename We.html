<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunaro Films | Cinematic Weddings</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
<link rel="icon" type="image/x-icon" href="assets/img/Tab/Logo.png">
<style>
:root {
    --gold: #c5a059; 
    --dark: #1a1a1a;
    --light: #fdfaf5;
    --shadow: rgba(0, 0, 0, 0.1);
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
html { scroll-behavior: smooth; }
body{font-family:'Montserrat',sans-serif;background:var(--light);overflow-x:hidden; color: var(--dark);}

/* NAVIGATION */
.back-nav{position:fixed;top:20px;left:20px;z-index:999;}
.back-btn{
    background:rgba(255, 255, 255, 0.9);
    border:1px solid var(--gold);
    padding:10px 25px;
    border-radius:50px;
    text-decoration:none;
    color:var(--gold);
    font-size:12px;
    font-weight: bold;
    transition: 0.4s;
    display: inline-block;
}
.back-btn:hover { background: var(--gold); color: #fff; transform: translateX(-5px); }

.book-now-btn{
    position:fixed;
    top:20px;
    right:20px;
    background:var(--gold);
    color:#fff;
    padding:12px 30px;
    border-radius:50px;
    text-decoration:none;
    font-weight: 600;
    z-index: 999;
    box-shadow: 0 10px 20px rgba(184, 154, 103, 0.3);
    transition: 0.3s;
}
.book-now-btn:hover { transform: scale(1.05); background: var(--dark); }

/* MUSIC PLAYER */
.music-vinyl-container{
    position:fixed;
    bottom:20px;
    left:20px;
    display:flex;
    gap:15px;
    align-items:center;
    z-index:999;
    background: rgba(255,255,255,0.9);
    padding: 8px 15px;
    border-radius: 50px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border: 1px solid var(--gold);
    cursor: pointer;
}
.vinyl-record{
    width:40px; height:40px;
    border-radius:50%;
    background: radial-gradient(circle, #333 20%, #000 100%);
    border: 2px solid #222;
    animation:spin 3s linear infinite;
    position: relative;
}
.vinyl-record::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px; background: var(--gold); border-radius: 50%;
}
@keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

/* ========================================= */
/* 🔥 REDESIGNED HERO SECTION (WEDDING) 🔥 */
/* ========================================= */

.hero {
    position: relative;
    height: 100vh;
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #050505;
}

/* Blurred Cinematic Background Video */
.hero-bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    transform: translate(-50%, -50%) scale(1.1);
    filter: blur(25px) brightness(0.3) contrast(1.1);
    z-index: 0;
    pointer-events: none;
    will-change: transform, filter;
}

.hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(5,5,5,0.9) 0%, rgba(5,5,5,0.4) 100%);
    z-index: 1;
}

.hero-container {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 90%;
    max-width: 1400px;
    gap: 40px;
    padding-top: 40px;
}

/* Typography & Layout matches Group 1.png */
.hero-text {
    flex: 1;
    text-align: left;
    padding-left: 2%;
    animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    opacity: 0;
    transform: translateY(30px);
}

@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}

.hero-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 6vw, 6.5rem);
    color: #fff;
    line-height: 1.1;
    margin-bottom: 10px;
    font-weight: 400; /* Regular weight for elegant feel */
    text-shadow: 2px 5px 20px rgba(0,0,0,0.8);
    letter-spacing: 1px;
}

.hero-text p {
    color: #eaeaea;
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(1rem, 1.5vw, 1.4rem);
    letter-spacing: 2px;
    font-weight: 200;
    margin-left: 5px;
}

/* 3D Floating Cinematic Card */
.hero-video-section {
    flex: 1.2;
    display: flex;
    justify-content: flex-end;
    perspective: 1200px;
    animation: fadeLeft 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
    opacity: 0;
    transform: translateX(40px);
}

@keyframes fadeLeft {
    to { opacity: 1; transform: translateX(0); }
}

.video-card-3d {
    position: relative;
    width: 100%;
    max-width: 700px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    transform-style: preserve-3d;
    /* Angle matches reference image */
    transform: rotateY(-12deg) rotateX(4deg) translateZ(0);
    box-shadow: 
        -20px 30px 50px rgba(0,0,0,0.8),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    cursor: pointer;
    transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.6s ease;
    background: #000;
    will-change: transform;
}

.video-card-3d::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 40%, rgba(197, 160, 89, 0.5) 100%);
    z-index: -1;
    transform: translateZ(-1px);
}

.video-card-3d:hover {
    transform: rotateY(-4deg) rotateX(2deg) translateY(-10px) translateZ(30px);
    box-shadow: 
        -10px 40px 70px rgba(0,0,0,0.9),
        0 0 40px rgba(197, 160, 89, 0.25);
}

.floating-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
    display: block;
    pointer-events: none; /* Pointer events handled by the wrapper */
    opacity: 0.95;
}

.video-glass-border {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.15);
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0) 100%);
    pointer-events: none;
    z-index: 2;
}

/* Continuous Floating Animation */
@keyframes float3D {
    0% { transform: rotateY(-12deg) rotateX(4deg) translateY(0px); }
    50% { transform: rotateY(-10deg) rotateX(6deg) translateY(-12px); }
    100% { transform: rotateY(-12deg) rotateX(4deg) translateY(0px); }
}

.floating-active {
    animation: float3D 6s ease-in-out infinite;
}

.video-card-3d:hover.floating-active {
    animation-play-state: paused; /* Allows hover transition to take over smoothly */
}

/* Custom Play/Pause Indicator */
.play-pause-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: 70px;
    height: 70px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(197, 160, 89, 0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 24px;
    z-index: 5;
    opacity: 0;
    transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    pointer-events: none;
}

.video-card-3d.paused .play-pause-indicator {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    background: rgba(0, 0, 0, 0.8);
    border-color: var(--gold);
}

/* ========================================= */
/* END OF REDESIGNED HERO CSS */
/* ========================================= */

/* GALLERY */
.gallery { padding: 100px 5%; background-color: var(--light); }
.masonry { column-count: 4; column-gap: 15px; }
.photo-item {
    margin-bottom: 15px;
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    transition: transform 0.4s ease;
}
.photo-item img {
    width: 100%; display: block;
    transition: 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}
.photo-item:hover img { transform: scale(1.08); }
.photo-item::after {
    content: "LUNARO WEDDINGS";
    position: absolute; bottom: 15px; right: 15px;
    color: rgba(255, 255, 255, 0.8); font-size: 10px;
    letter-spacing: 2px; opacity: 0; transition: 0.4s;
}
.photo-item:hover::after { opacity: 1; }

/* VIDEO GRID */
.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 30px;
    padding: 80px 5%;
    background: #000;
}

.video-card {
    position: relative;
    background: #111;
    overflow: hidden;
    border-radius: 12px;
    cursor: pointer;
    aspect-ratio: 16 / 9;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
}

.video-card:hover { transform: translateY(-10px); }
.video-thumb { width: 100%; height: 100%; }
.video-thumb img {
    width: 100%; height: 100%; object-fit: cover; opacity: 0.6;
    transition: 0.8s scale, 0.5s opacity;
}
.video-card:hover .video-thumb img { opacity: 0.3; scale: 1.1; }
.video-thumb i {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 50px; z-index: 2; opacity: 0.8;
    transition: 0.3s; text-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
}
.video-card:hover i { opacity: 1; scale: 1.2; color: var(--gold); }
.video-card::after {
    content: "WATCH FILM"; position: absolute; bottom: 20px; left: 20px;
    color: #fff; font-size: 10px; letter-spacing: 3px; font-weight: 600;
    opacity: 0; transform: translateY(10px); transition: 0.4s;
}
.video-card:hover::after { opacity: 1; transform: translateY(0); }

/* FOOTER */
footer { background: #000; color: #fff; padding: 60px 5%; text-align: center; }
.footer-logo { font-family: 'Playfair Display'; color: var(--gold); font-size: 2rem; margin-bottom: 20px; }
.footer-socials { margin: 20px 0; }
.footer-socials i { margin: 0 15px; font-size: 20px; cursor: pointer; transition: 0.3s; }
.footer-socials i:hover { color: var(--gold); }

/* ALL RESPONSIVE QUERIES (320px to 1920px) */
@media (min-width: 1440px) {
    .hero-container { max-width: 1600px; gap: 80px; }
    .hero-text h1 { font-size: 7.5rem; }
    .video-card-3d { max-width: 850px; }
}

@media (max-width: 1024px) {
    .masonry { column-count: 3; }
    .hero-container {
        flex-direction: column;
        justify-content: center;
        text-align: center;
        gap: 50px;
    }
    .hero-text {
        text-align: center;
        padding-left: 0;
        transform: translateY(20px);
        animation-name: fadeUpMobile;
    }
    @keyframes fadeUpMobile { to { opacity: 1; transform: translateY(0); } }
    
    .hero-text h1 { font-size: clamp(3.5rem, 8vw, 5rem); text-shadow: 2px 5px 15px rgba(0,0,0,0.6); }
    .hero-text p { margin-left: 0; font-size: 1.2rem; }
    
    .hero-video-section {
        justify-content: center;
        width: 100%;
        transform: translateY(40px);
        animation-name: fadeUpMobile;
    }
    .video-card-3d {
        transform: rotateY(0) rotateX(5deg);
        max-width: 80%;
    }
    .video-card-3d:hover {
        transform: rotateY(0) rotateX(0) translateY(-10px);
    }
    .floating-active {
        animation: float3DMobile 6s ease-in-out infinite;
    }
    @keyframes float3DMobile {
        0% { transform: rotateX(5deg) translateY(0px); }
        50% { transform: rotateX(8deg) translateY(-12px); }
        100% { transform: rotateX(5deg) translateY(0px); }
    }
}

@media (max-width: 820px) {
    .video-card-3d { max-width: 90%; }
}

@media(max-width: 768px) { 
    .masonry{column-count:2;} 
    .hero { padding: 80px 0; }
    .hero-text h1 { font-size: 4rem; } 
    .hero-container { gap: 30px; }
}

@media (max-width: 600px) {
    .video-card-3d { max-width: 95%; }
}

@media (max-width: 480px) {
    .hero-text h1 { font-size: 3rem; }
    .hero-text p { font-size: 1rem; }
    .video-card-3d { border-radius: 12px; }
    .video-card-3d::before { border-radius: 14px; }
    .video-glass-border { border-radius: 12px; }
    .play-pause-indicator { width: 60px; height: 60px; font-size: 20px; }
    .masonry { column-count: 1; }
}

@media (max-width: 375px) {
    .hero-text h1 { font-size: 2.6rem; }
    .back-btn { padding: 8px 18px; font-size: 10px; }
    .book-now-btn { padding: 10px 20px; font-size: 11px; }
}
</style>
</head>
<body>

<nav class="back-nav">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> BACK</a>
</nav>

<a href="Book/book.html" class="book-now-btn">BOOK YOUR STORY</a>

<div class="music-vinyl-container" id="musicToggle">
    <div class="vinyl-record" id="record"></div>
    <div>
        <i id="playIcon" class="fas fa-pause" style="color: var(--gold);"></i>
        <span id="statusText" style="font-size: 10px; font-weight: bold; color: var(--gold); margin-left: 5px;">PLAYING</span>
    </div>
    <audio id="bgMusic" loop autoplay muted>
        <source src="assets/Music/Wedding/Back.mp3" type="audio/mpeg">
    </audio>
</div>

<!-- REDESIGNED HERO SECTION -->
<section class="hero">
    <!-- Cinematic Blurred Background -->
    <video class="hero-bg-video" autoplay loop muted playsinline>
        <source src="https://res.cloudinary.com/dgt2qa9fm/video/upload/v1783858187/Groom_Teaser_nmuyfb.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>

    <div class="hero-container">
        <!-- Typography Side -->
        <div class="hero-text">
            <h1>Eternal Love</h1>
            <p>Wedding Cinema</p>
        </div>
        
        <!-- 3D Video Card Side -->
        <div class="hero-video-section">
            <div class="video-card-3d" id="teaserCard">
                <div class="video-glass-border"></div>
                
                <!-- Strictly configured video settings for premium feel -->
                <video class="floating-video" id="teaserVideo" autoplay loop  playsinline disablePictureInPicture controlsList="nodownload nofullscreen noplaybackrate">
                    <source src="https://res.cloudinary.com/dgt2qa9fm/video/upload/v1783858187/Groom_Teaser_nmuyfb.mp4" type="video/mp4">
                </video>
                
                <!-- Custom Tap/Click interactions -->
                <div class="play-pause-indicator" id="playPauseIndicator">
                    <i class="fas fa-pause"></i>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="gallery">
    <h2 style="text-align:center; color:var(--dark); font-family:'Playfair Display'; margin-bottom:40px; font-size: 2.5rem;">The Gallery</h2>
    <div class="masonry" id="gallery"></div>
</section>

<section style="background:var(--dark); color: #fff;">
    <h2 style="text-align:center; color:var(--gold); padding-top:60px; font-family:'Playfair Display'; font-size: 2.5rem;">Cinematic Films</h2>
    <div class="video-grid" id="videos"></div>
</section>

<footer>
    <div class="footer-logo">Lunaro Films</div>
    <p>We capture the soul of your most precious moments.</p>
    <div class="footer-socials">
        <a href="https://www.instagram.com/lunarofilms?igsh=MXI1eGE0OXZubGg5bw=="><i class="fab fa-instagram"></i></a>
    </div>
    <p style="font-size: 12px; opacity: 0.5;">&copy; 2025 Lunaro Films. All Rights Reserved.</p>
</footer>

<div id="lightbox" style="position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; justify-content:center; align-items:center; z-index:1000;" onclick="this.style.display='none'">
    <img id="lightImg" style="max-width:90%; max-height:80vh; border: 2px solid var(--gold);">
</div>

<script>
// 🔒 SECURITY SYSTEM
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("keydown", function(e) {
    if (e.key === "F12") e.preventDefault();
    if (e.ctrlKey && e.shiftKey && e.key === "I") e.preventDefault();
    if (e.ctrlKey && e.key === "U") e.preventDefault();
    if (e.key === "PrintScreen") {
        document.body.style.background = "black";
        setTimeout(() => document.body.style.background = "", 100);
    }
});

setInterval(() => {
    if (window.outerWidth - window.innerWidth > 100) {
        document.body.style.filter = "blur(15px)";
    } else {
        document.body.style.filter = "none";
    }
}, 500);

// 🎬 HERO VIDEO INTERACTION (TAP/CLICK TO PAUSE/PLAY)
const teaserCard = document.getElementById("teaserCard");
const teaserVideo = document.getElementById("teaserVideo");
const playPauseIndicator = document.getElementById("playPauseIndicator");

if(teaserCard && teaserVideo) {
    // Handling click/touch correctly for mobile and desktop
    teaserCard.addEventListener("click", () => {
        if(teaserVideo.paused) {
            teaserVideo.play();
            teaserCard.classList.remove("paused");
            playPauseIndicator.innerHTML = '<i class="fas fa-pause"></i>';
            
            // Show pause icon momentarily then hide
            playPauseIndicator.style.opacity = '1';
            playPauseIndicator.style.transform = 'translate(-50%, -50%) scale(1)';
            setTimeout(() => {
                if(!teaserVideo.paused) {
                    playPauseIndicator.style.opacity = '0';
                    playPauseIndicator.style.transform = 'translate(-50%, -50%) scale(0.8)';
                }
            }, 600);
        } else {
            teaserVideo.pause();
            teaserCard.classList.add("paused");
            playPauseIndicator.innerHTML = '<i class="fas fa-play"></i>';
        }
    });
    
    // Add floating animation class smoothly after entrance
    setTimeout(() => {
        teaserCard.classList.add("floating-active");
    }, 1500);
}

// 🎵 MUSIC CONTROL
const music = document.getElementById("bgMusic");
const record = document.getElementById("record");
const playIcon = document.getElementById("playIcon");
const statusText = document.getElementById("statusText");

window.addEventListener("load", () => {
    const savedTime = localStorage.getItem("musicTime");
    const savedState = localStorage.getItem("musicState");

    if (savedTime) music.currentTime = parseFloat(savedTime);

    if (savedState === "paused") {
        music.pause();
        record.style.animationPlayState = 'paused';
        playIcon.classList.replace("fa-pause", "fa-play");
        statusText.innerText = "PAUSED";
    } else {
        music.play().catch(() => {});
        record.style.animationPlayState = 'running';
        playIcon.classList.replace("fa-play", "fa-pause");
        statusText.innerText = "PLAYING";
    }
});

window.addEventListener('click', () => {
    if (music.paused && statusText.innerText === "PLAYING") {
        music.play().catch(() => {});
        record.style.animationPlayState = 'running';
    }
}, { once: true });

music.addEventListener("timeupdate", () => {
    localStorage.setItem("musicTime", music.currentTime);
});

document.getElementById("musicToggle").onclick = (e) => {
    e.stopPropagation();
    if (music.paused) {
        music.play();
        record.style.animationPlayState = 'running';
        playIcon.classList.replace("fa-play", "fa-pause");
        statusText.innerText = "PLAYING";
        localStorage.setItem("musicState", "playing");
    } else {
        music.pause();
        record.style.animationPlayState = 'paused';
        playIcon.classList.replace("fa-pause", "fa-play");
        statusText.innerText = "PAUSED";
        localStorage.setItem("musicState", "paused");
    }
};

// 🖼️ GALLERY POPULATOR
const gallery = document.getElementById("gallery");
const weddingImages = [
    "assets/img/Wedding/1 (1).jpg", 
    "assets/img/Wedding/1 (1).webp", 
    "assets/img/Wedding/1 (2).jpg", 
    "assets/img/Wedding/1 (2).webp", 
    "assets/img/Wedding/1 (3).jpg", 
    "assets/img/Wedding/1 (3).webp", 
    "assets/img/Wedding/1 (4).jpg", 
    "assets/img/Wedding/1 (2).jpg"
];
weddingImages.forEach(src => {
    let div = document.createElement("div");
    div.className = "photo-item";
    div.innerHTML = `<img src="${src}" draggable="false" loading="lazy">`;
    div.onclick = () => {
        document.getElementById("lightImg").src = src;
        document.getElementById("lightbox").style.display = "flex";
    };
    gallery.appendChild(div);
});

// 🎥 VIDEO POPULATOR
const vids = [
    { link: "https://youtu.be/-bYAMk91Lzc?si=tSG5mrnRoapypO8q", thumb: "assets/img/Wedding/Thumbnail/1.jpg" },
    { link: "https://youtu.be/tyBJioe8gOs?si=f7bIDzCWJ4lRWQTN", thumb: "assets/img/Wedding/Thumbnail/2.jpg" },
    { link: "https://youtu.be/OYQzr1VV5Eg?si=eE4sJ_2hVpPykf5a", thumb: "assets/img/Wedding/Thumbnail/3.jpg" }   
];

const videoDiv = document.getElementById("videos");
vids.forEach(v => {
    let card = document.createElement("div");
    card.className = "video-card";
    card.onclick = () => window.location.href = v.link;
    card.innerHTML = `
        <div class="video-thumb">
            <img src="${v.thumb}" draggable="false" loading="lazy">
            <i class="fas fa-play-circle"></i>
        </div>
    `;
    videoDiv.appendChild(card);
});
</script>
</body>
</html>
